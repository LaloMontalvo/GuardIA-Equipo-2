name: Paquetes de revisión

on:
  push:
    branches: [main]
    paths: ['.github/workflows/paquetes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar-componentes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publicar ramas de GuardIA
        shell: bash
        run: |
          set -euo pipefail
          declare -a branches=(panel-web backend ia movil)
          missing=()
          for branch in "${branches[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then missing+=("$branch"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then exit 0; fi
          staging=$(mktemp -d)
          git clone --quiet --no-checkout https://github.com/rodolfo-estrada/GuardIA.git "$staging/web"
          git clone --quiet --no-checkout https://github.com/LaloMontalvo/GuardIA-Movil.git "$staging/mobile"
          git config user.name "GuardIA Equipo 2"
          git config user.email "guardia-equipo-2@users.noreply.github.com"
          for branch in "${missing[@]}"; do
            origin=rodolfo-estrada/GuardIA
            source="$staging/web"
            revision=e2a973e994aa9ac4d3fb910f98c951f05d2f164f
            case "$branch" in
              panel-web) paths=(.gitignore .env.example architecture eslint.config.js index.html mockups mockups_realistic package-lock.json package.json postcss.config.js public src tailwind.config.js tsconfig.app.json tsconfig.json tsconfig.node.json vite.config.ts); doc=''; ;;
              backend) paths=(.gitignore .firebaserc api db docker-compose.yml docs firebase.json firestore.rules functions); doc=''; ;;
              ia) paths=(.gitignore guardia_ai ml_service); doc=''; ;;
              movil) paths=(.gitignore .metadata analysis_options.yaml android assets DECISIONES_TECNICAS.md firebase.json ios lib linux macos mockups_pantalla_por_pantalla mockups_realistas pubspec.lock pubspec.yaml test TECH_STACK.md web windows); doc=''; source="$staging/mobile"; origin=LaloMontalvo/GuardIA-Movil; revision=dc0a42be34ae6f1ed7325c214f540e91399aa542; ;;
            esac
            target="$staging/$branch"
            git worktree add --quiet -b "$branch" "$target" "$GITHUB_SHA"
            git -C "$target" rm -r --quiet -- .
            git -C "$source" archive "$revision" -- "${paths[@]}" | tar -x -C "$target"
            git -C "$target" add --all
            git -C "$target" commit --quiet -m "Importar $branch de $origin en $revision"
            printf '%s' "$doc" | base64 --decode > "$target/README.md"
            if [ "$branch" = ia ]; then
              printf '%s' 'ZmFzdGFwaQp1dmljb3JuCmpvYmxpYgpudW1weQpwYW5kYXMKc2Npa2l0LWxlYXJuPT0xLjYuMQo=' | base64 --decode > "$target/ml_service/requirements.txt"
            fi
            git -C "$target" add --all
            git -C "$target" commit --quiet -m "Documentar la instalación de $branch"
            if [ "$branch" = backend ]; then
              printf '%s' '' | base64 --decode > "$target/api/src/server.js"
              node --check "$target/api/src/server.js"
              git -C "$target" add api/src/server.js
              git -C "$target" commit --quiet -m "Restaurar el inicio de la API y separar los puertos de IA"
            fi
          done
          git push --atomic origin "${missing[@]}"

  panel:
    needs: publicar-componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: panel-web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: cd dist && zip -q -r ../guardia-panel.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: guardia-panel
          path: guardia-panel.zip
          if-no-files-found: error

  android:
    needs: publicar-componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movil
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
      - run: cp build/app/outputs/flutter-apk/app-debug.apk guardia-movil-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: guardia-android-debug
          path: guardia-movil-debug.apk
          if-no-files-found: error

  deteccion:
    needs: publicar-componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ia
      - run: zip -q -r guardia-deteccion-docker.zip guardia_ai
      - uses: actions/upload-artifact@v4
        with:
          name: guardia-deteccion-docker
          path: guardia-deteccion-docker.zip
          if-no-files-found: error

  release:
    needs: [publicar-componentes, panel, android, deteccion]
    if: ${{ always() && needs.publicar-componentes.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Adjuntar paquetes a la versión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(paquetes/*.zip paquetes/*.apk)
          if [ "${#assets[@]}" -eq 0 ]; then exit 1; fi
          if gh release view entrega-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload entrega-v1 "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create entrega-v1 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'GuardIA · Entrega técnica' --notes 'Paquetes generados para la revisión técnica. El APK usa firma de depuración. El panel requiere configurar Firebase para compilar una versión funcional en el entorno de revisión.'
          fi
