name: Paquetes de revisión

on:
  push:
    branches: [main]
    paths: ['.github/workflows/paquetes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '45271672356'
          name: guardia-android-debug
          path: paquetes
          merge-multiple: true
      - name: Adjuntar el APK de revisión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view entrega-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq guardia-movil-debug.apk; then exit 0; fi
          gh release upload entrega-v1 paquetes/guardia-movil-debug.apk --repo "$GITHUB_REPOSITORY"

  panel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: panel-web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: cd dist && zip -q -r ../guardia-panel.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: guardia-panel
          path: guardia-panel.zip
          if-no-files-found: error

  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movil
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
      - run: cp build/app/outputs/flutter-apk/app-debug.apk guardia-movil-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: guardia-android-debug
          path: guardia-movil-debug.apk
          if-no-files-found: error

  deteccion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ia
      - run: zip -q -r guardia-deteccion-docker.zip guardia_ai
      - uses: actions/upload-artifact@v4
        with:
          name: guardia-deteccion-docker
          path: guardia-deteccion-docker.zip
          if-no-files-found: error

